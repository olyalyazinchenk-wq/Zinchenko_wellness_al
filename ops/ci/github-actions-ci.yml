name: NutriOK CI

on: [push, pull_request]

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r WellnessBot/requirements.txt -r requirements-dev.txt ruff
      - run: ruff check WellnessBot tests --select E9,F63,F7,F82
      - run: python -m compileall -q WellnessBot tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: WellnessBot
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm build && node --test tests/rendered-html.test.mjs
